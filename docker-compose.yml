services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        # Set true to install heavy local AI deps (torch/whisper).
        INSTALL_AI_DEPS: "false"
    ports:
      - "8000:8000"
    volumes:
      # Prod: persist uploads on the host without mounting source code.
      - ./data:/data
    environment:
      - STORAGE_ROOT=/data

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    volumes:
      # Needed when frontend API routes persist temporary uploads.
      - ./data:/data
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
      - STORAGE_ROOT=/data
    depends_on:
      - backend

# Use docker-compose.dev.yml for local development overrides.
